# Development profile — uses local MySQL via Docker Compose
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:garagemate_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:garagemate}
    password: ${DB_PASSWORD:garagemate_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop      # Recreate schema in dev
    show-sql: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}       # MailHog default
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-me-must-be-long-enough-32chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-change-me-must-be-long-enough-32chars}
  demo-mode: true

logging:
  level:
    com.garagemate: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
