spring:
  application:
    name: garagemate-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate           # Overridden per-profile
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Caching (Caffeine)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

  # Email (configure per-environment via env vars)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Async
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100

server:
  port: ${PORT:5000}
  servlet:
    context-path: /
  error:
    include-message: never        # Never expose stack traces in production

# ── Application config ──────────────────────────────────────────────────────
app:
  # JWT
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  # CORS
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  # Feature flags
  demo-mode: ${DEMO_MODE:false}

  # Frontend URL (used in email links)
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # Razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  # Cloudinary
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  # Firebase (optional — set path to service account JSON)
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:#{null}}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.garagemate: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
